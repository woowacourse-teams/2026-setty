<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1690" viewBox="0 0 2400 1690" role="img" aria-labelledby="title desc">
<title id="title">SETTY 시스템 인프라 아키텍처와 배포 파이프라인</title>
<desc id="desc">웹과 모바일 클라이언트, CloudFront, S3, ALB, EC2의 Spring Boot, MySQL, 외부 연동 및 CloudWatch를 표현한다. GitHub Actions CI와 첨부 그림 기준 AWS CodePipeline, CodeBuild, S3 배포 아티팩트, CodeDeploy 및 EC2 Agent의 배포 경로를 구분한다. 확인되지 않은 콘솔 설정과 DB 배치 위치는 별도로 표시한다.</desc>
