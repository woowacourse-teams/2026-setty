<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" role="img" aria-label="구현 한눈에: 서버가 켜질 때 거리표 0.73MB를 메모리에 올리고, 요청이 오면 메모리에서 통과하는 판매자 동네 목록을 계산하고, DB는 그 목록을 조건으로 색인에서 최신순 21개만 읽음"><defs><marker id="d1-overview-ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" class="mkf"/></marker></defs><text class="lb" x="150.0" y="20.0" text-anchor="middle">서버가 켜질 때</text><text class="lb" x="450.0" y="20.0" text-anchor="middle">요청이 올 때 · 서버 메모리</text><text class="lb" x="750.0" y="20.0" text-anchor="middle">요청이 올 때 · DB</text><line class="axl" x1="300" y1="10" x2="300" y2="70"/><line class="axl" x1="300" y1="104" x2="300" y2="170"/><line class="axl" x1="600" y1="10" x2="600" y2="70"/><line class="axl" x1="600" y1="104" x2="600" y2="170"/><rect class="bk" x="40.0" y="40.0" width="220.0" height="110.0" rx="4"/><text class="lb" x="150.0" y="66.0" text-anchor="middle">① 거리표를 메모리에 올림</text><text class="sl" x="150.0" y="98.0" text-anchor="middle">427개 동끼리 도로 거리</text><text class="sl" x="150.0" y="124.0" text-anchor="middle">0.73MB, 한 번만 읽음</text><rect class="bk hi" x="340.0" y="40.0" width="220.0" height="110.0" rx="4"/><text class="lb" x="450.0" y="66.0" text-anchor="middle">② 통과하는 판매자 동네 계산</text><text class="sl" x="450.0" y="98.0" text-anchor="middle">구매자 동네 + 예산</text><text class="sl" x="450.0" y="124.0" text-anchor="middle">→ 부피별 판매자 동네 목록</text><rect class="bk" x="640.0" y="40.0" width="220.0" height="110.0" rx="4"/><text class="lb" x="750.0" y="66.0" text-anchor="middle">③ 색인에서 최신순으로 거르기</text><text class="sl" x="750.0" y="98.0" text-anchor="middle">판매자 동네 목록을 조건으로</text><text class="sl" x="750.0" y="124.0" text-anchor="middle">맞는 매물 21개만 읽음</text><path class="ln2" d="M262 95 L336 95" marker-end="url(#d1-overview-ah5)"/><path class="ln2" d="M562 95 L636 95" marker-end="url(#d1-overview-ah5)"/><text class="co" x="299.0" y="86.0" text-anchor="middle">표에서 읽기</text><text class="co" x="599.0" y="86.0" text-anchor="middle">조건으로 넘김</text></svg>