<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="커넥션 빌리기 전후: 전에는 구매자 동네, 목록, 대표 사진을 읽을 때마다 커넥션을 따로 빌려 줄을 설 수 있는 곳이 세 번, 후에는 한 번 빌려 세 쿼리를 이어 읽고 JSON 변환 전에 반납"><text class="pt" x="10" y="26">전: 쿼리마다 커넥션을 따로 빌리고 반납</text><rect class="wq" x="10" y="40" width="44" height="34" rx="4"/><text class="wl" x="32" y="62" text-anchor="middle">대기?</text><rect class="cu" x="58" y="40" width="150" height="34" rx="4"/><text class="sl" x="133.0" y="62" text-anchor="middle">구매자 동네</text><rect class="wq" x="214" y="40" width="44" height="34" rx="4"/><text class="wl" x="236" y="62" text-anchor="middle">대기?</text><rect class="cu" x="262" y="40" width="150" height="34" rx="4"/><text class="sl" x="337.0" y="62" text-anchor="middle">매물 목록</text><rect class="wq" x="418" y="40" width="44" height="34" rx="4"/><text class="wl" x="440" y="62" text-anchor="middle">대기?</text><rect class="cu" x="466" y="40" width="150" height="34" rx="4"/><text class="sl" x="541.0" y="62" text-anchor="middle">대표 사진</text><rect class="jx" x="622" y="40" width="200" height="34" rx="4"/><text class="sl" x="722" y="62" text-anchor="middle">JSON으로 바꾸기</text><text class="pt" x="10" y="136">후: 한 번 빌려 세 쿼리를 이어 읽고 반납</text><rect class="wq" x="10" y="150" width="44" height="34" rx="4"/><text class="wl" x="32" y="172" text-anchor="middle">대기?</text><rect class="cu" x="58" y="150" width="456" height="34" rx="4"/><text class="sl" x="286" y="172" text-anchor="middle">구매자 동네 → 매물 목록 → 대표 사진</text><rect class="jx" x="520" y="150" width="200" height="34" rx="4"/><text class="sl" x="620" y="172" text-anchor="middle">JSON으로 바꾸기</text><text class="lb" x="10" y="214">커넥션을 기다릴 수 있는 곳: 전 3번 → 후 1번</text></svg>