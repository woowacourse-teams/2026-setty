version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm --prefix client ci

  pre_build:
    commands:
      - npm --prefix client run lint
      - npm --prefix client run typecheck
      - npm --prefix client run test:ci

  build:
    commands:
      - npm --prefix client run build

  post_build:
    commands:
      - aws s3 sync client/dist/ "s3://${DEPLOY_BUCKET}/${DEPLOY_PREFIX}/"
      - |
        set -eu
        INVALIDATION_ID="$(
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text
        )"
        aws cloudfront wait invalidation-completed \
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
          --id "$INVALIDATION_ID"
      - curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SMOKE_URL"\
