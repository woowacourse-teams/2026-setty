name: 작업 Issue
description: 작업의 필요성과 기대 상태를 기록합니다.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        제목은 정확히 `<type>: 한글 제목` 형식으로 작성하고, 아래 유형 중 하나만 선택합니다.

        - `build`: 빌드 시스템 또는 외부 의존성 변경
        - `ci`: CI 설정 또는 스크립트 변경
        - `docs`: 문서만 변경
        - `feat`: 사용자 또는 운영자에게 새 기능 제공
        - `fix`: 버그 수정
        - `perf`: 측정 가능한 성능 개선
        - `refactor`: 기능 추가나 버그 수정이 아닌 코드 구조 변경
        - `style`: 코드 의미에 영향을 주지 않는 서식·표현 변경
        - `test`: 테스트 추가 또는 기존 테스트 수정만 수행

        공유 정책 변경은 `docs/policy/policy-guide.md`의 절차를 따릅니다.
  - type: textarea
    id: reason
    attributes:
      label: 왜 지금 필요한가
      description: 다른 사람이 같은 문제를 이해할 수 있도록 배경과 현재 문제를 적습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떤 상태를 기대하는가
      description: 작업이 끝났는지 판단할 수 있는 결과를 적습니다.
    validations:
      required: true
