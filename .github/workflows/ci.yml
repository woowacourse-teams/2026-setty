name: CI

on:
  pull_request:
  push:
    # develop만 검사한다. develop이 개발 통합 기준이자 배포 트리거다(DEC-026).
    # main은 develop에서만 병합되고 그 시점에 이미 검사를 통과했다.
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 코드 규칙 검사
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm run test:ci

      - name: 빌드 검증
        run: npm run build

      - name: 빌드 결과물 보관
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7
