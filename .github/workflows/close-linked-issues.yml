name: Close linked issues on develop merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close issues referenced in the PR body
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const references = body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)\b/gi);
            const numbers = new Set([...references].map((match) => Number(match[1])));
            const { owner, repo } = context.repo;

            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request || issue.state === "closed") continue;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
            }
