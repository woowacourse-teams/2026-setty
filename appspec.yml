version: 0.0
os: linux

files:
  - source: /
    destination: /opt/setty/app
file_exists_behavior: OVERWRITE

permissions:
  - object: /opt/setty/app/scripts
    pattern: '**'
    mode: 755
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  # ApplicationStop은 직전 성공 배포의 스크립트로 실행되므로 첫 배포에서는 돌지 않는다.
  # 기존 컨테이너 정리는 전부 ApplicationStart에서 처리한다.
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 900
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 300
      runas: root
