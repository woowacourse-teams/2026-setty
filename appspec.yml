version: 0.0
os: linux

# 배포별 CodeDeploy archive를 수신 경로로 사용한다. 슬롯 JAR는 훅이 복사하므로
# 다음 리비전의 파일 정리 대상에 실행 중인 슬롯 파일이 포함되지 않는다.
# 전제와 환경별 설정: server/deploy/README.md
hooks:
  BeforeInstall:
    - location: server/deploy/blue-green/preflight.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: server/deploy/blue-green/deploy.sh
      timeout: 1200
      runas: root
