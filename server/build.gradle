plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.gatling.gradle' version '3.15.1.3'
}

group = 'setty'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-opentelemetry'
    implementation 'io.micrometer:micrometer-registry-otlp'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 비밀번호 해시(BCrypt)만 쓴다. 필터 체인·자동 설정이 붙는 spring-boot-starter-security는 넣지 않는다.
    implementation 'org.springframework.security:spring-security-crypto'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.opentelemetry.proto:opentelemetry-proto:1.10.0-alpha'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'

    implementation platform('software.amazon.awssdk:bom:2.46.8')
    implementation 'software.amazon.awssdk:s3'

    // 모듈 간 이벤트를 커밋 이후 별도 트랜잭션에서 처리하고, 발행 기록(EVENT_PUBLICATION)으로 실패 건을 재발행한다.
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
}

tasks.named('test') {
    useJUnitPlatform()
}
