version: 0.1

files:
  - source: /
    destination: /opt/setty/source

permissions:
  - object: /opt/setty/source/server/deploy/scripts
    pattern: '**'
    mode: 755
    type:
      - file

scripts:
  BeforeDeploy:
    - location: server/deploy/scripts/before_install.sh
      timeout: 300
      runas: root

  AfterDeploy:
    - location: server/deploy/scripts/build.sh
      timeout: 900
      runas: root
    - location: server/deploy/scripts/start.sh
      timeout: 300
      runas: root
    - location: server/deploy/scripts/validate.sh
      timeout: 360
      runas: root
