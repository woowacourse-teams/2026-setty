# 테스트 서버를 모든 주소가 아니라 루프백에만 연다. 모든 주소에 열면 macOS 방화벽이 실행마다 허용 창을 띄운다.
# classpath:/config/ 파일이라 main의 application.yml을 가리지 않고 그 위에 더해진다.
server.address=127.0.0.1

# 많은 테스트가 SQL로 배송 행을 직접 바꾼 뒤 목록을 읽는다. 이벤트를 거치지 않는 변경은 캐시가 가리므로 기본으로 끄고,
# 캐시 동작은 setty.delivery.request-cache.enabled=true로 켠 테스트에서 확인한다.
setty.delivery.request-cache.enabled=false
