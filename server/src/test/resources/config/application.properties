# 테스트 서버를 모든 주소가 아니라 루프백에만 연다. 모든 주소에 열면 macOS 방화벽이 실행마다 허용 창을 띄운다.
# classpath:/config/ 파일이라 main의 application.yml을 가리지 않고 그 위에 더해진다.
server.address=127.0.0.1

# 테스트는 같은 컨텍스트에서 승인을 빠르게 여러 번 부른다. 승인 한도에 걸리지 않게 넉넉히 둔다.
setty.payment.confirm-limit.capacity=100000
setty.payment.confirm-limit.refill-per-second=100000
