spring:
  application:
    name: setty

  datasource:
    url: jdbc:mysql://localhost:3306/setty
    username: setty
    password: setty

  jpa:
    hibernate:
      # 스키마는 schema.sql로만 변경한다 (server/AGENTS.md). 엔티티와 스키마가 어긋나면 부팅이 실패한다.
      ddl-auto: validate

  sql:
    init:
      mode: always

  modulith:
    events:
      jdbc:
        # EVENT_PUBLICATION도 schema.sql로만 관리한다.
        schema-initialization:
          enabled: false
      # 처리 완료된 발행 기록은 지워 테이블이 계속 쌓이지 않게 한다. 미완료·실패 건만 남는다.
      completion-mode: delete
      # 처리 도중 서버가 내려가 남은 발행 기록은 재시작 시 다시 발행한다.
      republish-outstanding-events-on-restart: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

management:
  otlp:
    metrics:
      export:
        enabled: false

setty:
  order:
    pending-expiration:
      timeout: ${PENDING_ORDER_EXPIRATION_TIMEOUT:PT6M}
      scan-interval: ${PENDING_ORDER_EXPIRATION_SCAN_INTERVAL:PT1M}
    completion:
      scan-interval: ${ORDER_COMPLETION_SCAN_INTERVAL:PT1M}
  storage:
    listing-images:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${SETTY_S3_BUCKET:setty-listing-local}
      public-base-url: ${SETTY_S3_PUBLIC_BASE_URL:https://setty-listing-local.s3.ap-northeast-2.amazonaws.com}
  payment:
    # 결제 성공/실패 복귀(GET /payments/success·/fail) 처리 후 브라우저를 돌려보낼 프론트 주소.
    client-redirect-url: ${PAYMENT_CLIENT_REDIRECT_URL:http://localhost:3000}
    toss:
      # 토스페이먼츠 결제위젯 공개 테스트 시크릿키(문서 공개값, 비밀 아님). 실제 결제는 붙이지 않는다.
      # 클라 위젯 클라이언트 키(test_gck_docs_Ovk5rk1…)와 짝이 되는 위젯 시크릿(gsk). 쌍이 맞아야 승인이 통과한다.
      secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_Ovk5rk1EwkEbP0W43n07xlzm}
      base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
