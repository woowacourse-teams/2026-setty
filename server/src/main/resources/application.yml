aws:
  s3:
    region: ap-northeast-2
    bucket-name: techcourse-project-2026
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/setty
    username: setty
    password: setty
  jpa:
    hibernate:
      ddl-auto: update
      open-in-view: false
  servlet:
    multipart:
      # 프로토타입 매물 등록이 사진 5장·전체 25MB까지 받는다.
      # 배차 사진 1장 10MB 한도는 ItemImageStorage가 코드에서 확인한다.
      max-file-size: 25MB
      max-request-size: 26MB
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
setty:
  operator:
    secret: ${SETTY_OPERATOR_SECRET:}
  front:
    base-url: ${SETTY_FRONT_BASE_URL:http://localhost:3000}
  notification:
    discord:
      dispatch-webhook-url: ${SETTY_DISCORD_DISPATCH_WEBHOOK_URL:}
      estimate-webhook-url: ${SETTY_DISCORD_ESTIMATE_WEBHOOK_URL:}
