# 로컬 스키마 전환 실험 전용. 비밀번호는 실행 환경에서 제공한다.
server:
  address: 127.0.0.1

spring:
  datasource:
    url: ${SCHEMA_LAB_JDBC_URL:jdbc:mysql://127.0.0.1:13306/setty_schema_transition_lab}
    username: ${SCHEMA_LAB_DB_USER:setty_schema_lab}
    password: ${SCHEMA_LAB_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true

management:
  otlp:
    metrics:
      export:
        enabled: false

setty:
  address:
    backfill:
      enabled: false
  listing:
    zip-zone-backfill:
      enabled: false
  notification:
    sender: noop
  order:
    pending-expiration:
      scan-interval: PT24H
    completion:
      scan-interval: PT24H
