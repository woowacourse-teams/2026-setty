name: setty-schema-lab

x-slot: &slot
  image: eclipse-temurin:21-jre
  command: ["java", "-XX:MaxRAMPercentage=60", "-jar", "/app/app.jar"]
  mem_limit: 768m
  stop_grace_period: 60s
  environment:
    SERVER_ADDRESS: 0.0.0.0
    SERVER_PORT: "8080"
    SPRING_PROFILES_ACTIVE: schema-lab
    SCHEMA_LAB_JDBC_URL: jdbc:mysql://db:3306/setty_schema_transition_lab
    SCHEMA_LAB_DB_USER: setty_schema_lab
    SCHEMA_LAB_DB_PASSWORD: schema_lab_only
  profiles: [slots]

services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: setty_schema_transition_lab
      MYSQL_USER: setty_schema_lab
      MYSQL_PASSWORD: schema_lab_only
      MYSQL_ROOT_PASSWORD: schema_lab_root_only
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  blue:
    <<: *slot
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - "${SCHEMA_LAB_RUNTIME_ROOT:?run lab.py with a run ID}/slots/blue:/app:ro"
    labels:
      setty.schema-lab.version: "${SCHEMA_LAB_BLUE_VERSION:-unset}"

  green:
    <<: *slot
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - "${SCHEMA_LAB_RUNTIME_ROOT:?run lab.py with a run ID}/slots/green:/app:ro"
    labels:
      setty.schema-lab.version: "${SCHEMA_LAB_GREEN_VERSION:-unset}"

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:18000:8080"
    volumes:
      - "${SCHEMA_LAB_RUNTIME_ROOT:?run lab.py with a run ID}/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${SCHEMA_LAB_RUNTIME_ROOT:?run lab.py with a run ID}/nginx:/etc/nginx/schema-lab:ro"

volumes:
  db-data:
