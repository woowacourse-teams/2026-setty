worker_processes 1;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    log_format schema_lab '$time_iso8601 probe_id=$http_x_request_id '
                          'request_id=$upstream_http_x_request_id '
                          '"$request" status=$status upstream=$upstream_addr';
    access_log /dev/stdout schema_lab;
    client_max_body_size 26m;
    include /etc/nginx/schema-lab/active-upstream.conf;

    server {
        listen 8080;
        location / {
            proxy_pass http://setty_schema_lab;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $http_x_request_id;
            add_header X-Schema-Lab-Upstream $upstream_addr always;
        }
    }
}
